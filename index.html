<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Growth OS | Sanctuary Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Sans+TC:wght@300;400&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #F8F5F2; color: #5D5246; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .glass { background: #FFFFFF; border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid #EAE6E1; }
        .section-header { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; text-align: center; margin: 1.5rem 0; color: #8E7E6E; }
        .sub-header { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: bold; color: #8E7E6E; margin-bottom: 10px; }
        .task-row { cursor: pointer; padding: 12px 0; border-bottom: 1px solid #F4F1ED; font-size: 13px; }
        .task-row.done { opacity: 0.4; text-decoration: line-through; }
        .num-btn { width: 45px; height: 45px; background: #EAE6E1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .media-btn { background: #F4F1ED; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; display: inline-block; }
    </style>
</head>
<body class="max-w-[450px] mx-auto pb-24">

    <div id="p0" class="page active">
        <h2 class="section-header">Morning Ritual</h2>
        <div class="glass text-center p-6"><div id="dailyAffirmation" class="italic text-sm font-bold mb-4"></div><button onclick="updateAffirmation()" class="text-[10px] text-[#C4B5A5] border px-4 py-1 rounded-full">再抽一句</button></div>
        <div class="glass"><h3 class="sub-header text-center">晨間校準儀式</h3><div id="resetList" class="text-[12px] space-y-4"></div></div>
        <div class="glass"><div id="numGrid" class="flex flex-wrap gap-3 justify-center mb-6"></div><div id="ritualDisplayArea" class="p-4 bg-[#F4F1ED] rounded-xl text-[14px] italic text-center">點擊數字啟動能量...</div></div>
    </div>

    <div id="p1" class="page"><h2 class="section-header">Growth Path</h2><div id="pathContainer"></div></div>

    <div id="p2" class="page">
        <h2 class="section-header">Journal</h2>
        <div id="tagContainer" class="flex flex-wrap gap-2 mb-4 justify-center"></div>
        <div id="guideContainer" class="p-4 bg-[#F4F1ED] rounded-xl text-xs italic mb-4 text-center border border-[#EAE6E1]">點選上方標籤查看覺察指引...</div>
        <div class="glass">
            <textarea id="journalArea" class="w-full h-24 p-2 text-sm border-none bg-transparent" placeholder="記錄當下覺察..."></textarea>
            <div class="flex gap-2 mb-4">
                <label class="media-btn"><i class="fa-solid fa-image"></i> 圖片<input type="file" id="imgInput" class="hidden" accept="image/*" onchange="previewImg(event)"></label>
                <button id="micBtn" class="media-btn" onclick="toggleRecord()"><i class="fa-solid fa-microphone"></i> 錄音</button>
            </div>
            <img id="imgPreview" class="hidden w-full h-32 object-cover rounded-lg mb-2">
            <audio id="audioPlayback" controls class="hidden w-full mb-2"></audio>
            <button onclick="addJournal()" class="w-full bg-[#8E7E6E] text-white py-2 rounded-lg text-xs font-bold">儲存日記</button>
        </div>
        <div id="journalList"></div>
    </div>

    <nav class="fixed bottom-0 w-full max-w-[450px] bg-[#F8F5F2] border-t h-20 flex items-center justify-around z-50">
        <button onclick="go(0)" class="text-xs font-bold">儀式</button><button onclick="go(1)" class="text-xs font-bold">路徑</button><button onclick="go(2)" class="text-xs font-bold">手帳</button>
    </nav>

<script>
    const data = {
        aff: ["我是豐盛的磁鐵。", "我充滿愛與溫柔。", "我擁抱每個契機。", "困難使我強大。", "我準備好迎接最棒的一天。", "我的行動帶有意圖。", "我歡迎所有的豐盛。", "我對自己充滿信心。", "我保持平靜專注。", "每一刻都是新的開始。"],
        reset: [{t: "「今天會是美好的一天。」", n: "開啟大腦的「機會掃描器」。"}, {t: "「今天會有酷的事情發生在我身上。」", n: "開啟大腦的「機會掃描器」。"}, {t: "「無論今天發生什麼，我都能應對。」", n: "對抗失控的焦慮。"}, {t: "「今天是我生命中令人興奮的新篇章。」", n: "擁抱新開端。"}, {t: "「對於自己的努力，我值得更多的肯定。」", n: "給予自己慈悲。"}, {t: "「我被允許成為一個『正在進步中』的人。」", n: "放下完美主義。"}, {t: "「只要我持續出現，生命就會回饋我。」", n: "長期主義價值。"}, {t: "「我對這個世界有著重要的貢獻。」", n: "肯定自我價值。"}],
        rit: {"1": "【1號領航者】聚焦本質，踏出第一步。", "2": "【2號連結者】創造流動，傾聽與平衡。", "3": "【3號表達者】大膽表達，創意自由流露。", "4": "【4號穩固者】建立秩序，搭建具體架構。", "5": "【5號探險者】擁抱未知，在多變中看見機會。", "6": "【6號守護者】療癒彼此，用同理心照顧連結。", "7": "【7號觀察者】深入內在，在寧靜中聆聽指引。", "8": "【8號顯化者】發揮力量，將願景轉化為豐盛。", "9": "【9號圓滿者】釋放過去，清空羈絆迎接更新。"},
        guide: { "身體感官": ["今天身體哪裡感覺舒適？", "是否有感謝美味的食物？", "感謝自己能自由移動的時刻。"], "自我成長": ["今天克服了什麼小困難？", "哪一刻感到更靠近真實自己？", "是否有展現勇氣的瞬間？"], "關係連結": ["有人對你溫暖微笑嗎？", "今天是否學會設定界線？", "為別人做了一件什麼事？"], "環境機緣": ["生活中出現什麼小巧合？", "環境中哪裡讓你感到安全？", "宇宙給了你什麼靈感？"] },
        path: [
            {t: "【覺察之眼】觀照日常的細微變動", d: "視覺、減壓與自我觀察。", items: [{n: "視覺碎形化", s: "換一條路走，拍下美學細節。"}, {n: "數位減壓", s: "1 小時飛航模式。"}, {n: "窒息點紀錄", s: "紀錄焦慮時刻身體反應。"}, {n: "原形冒險", s: "嘗試未吃過的蔬果。"}, {n: "童心拾遺", s: "給小物件賦予故事。"}, {n: "抽離練習", s: "旁觀者觀察對話。"}, {n: "視覺排版", s: "整理桌面角落。"}]},
            {t: "【實驗之場】重塑感官與生命節奏", d: "生理、飲食與日常節奏。", items: [{n: "糖分斷捨離", s: "不喝含糖飲料。"}, {n: "血糖與情緒", s: "紀錄血糖與情緒波動。"}, {n: "藍光斷電", s: "睡前關閉螢幕。"}, {n: "動態冥想", s: "走路時練習深呼吸。"}, {n: "精準補水", s: "每小時喝水 200ml。"}, {n: "優雅說不", s: "拒絕非必要的邀約。"}, {n: "抗炎美學", s: "準備含薑黃的餐點。"}]},
            {t: "【定義之鑰】描繪靈魂的願景藍圖", d: "價值觀與未來劇本。", items: [{n: "亮點掃描", s: "找出成就時刻。"}, {n: "無限制假設", s: "發掘熱情。"}, {n: "靈數對話", s: "與自己對話。"}, {n: "他人之鏡", s: "優點清單。"}, {n: "提案思維", s: "改善方案。"}, {n: "靈感寶庫", s: "心動句子。"}, {n: "三年劇本", s: "理想生活。"}, {n: "撕掉標籤", s: "刪除限制。"}]},
            {t: "【實踐之流】將願景化為具體顯化", d: "行動、財務與生活連結。", items: [{n: "勇敢發聲", s: "表達觀點。"}, {n: "職能重構", s: "核心優勢。"}, {n: "浪漫儀式", s: "買一束花。"}, {n: "財務目標", s: "儲蓄目標。"}, {n: "跨界連結", s: "交流。"}, {n: "碎片冒險", s: "改變順序。"}, {n: "實驗結案", s: "總結。"}, {n: "重新定義", s: "信念。"} ]}
        ]
    };

    // 邏輯處理 (保持不變以確保穩固)
    let journals = JSON.parse(localStorage.getItem('mia_journals')) || [];
    let mediaRecorder, audioChunks = [];
    
    function addJournal() {
        const text = document.getElementById('journalArea').value;
        if (!text) return;
        const entry = { id: Date.now(), text, date: new Date().toLocaleString(), img: document.getElementById('imgPreview').src, audio: document.getElementById('audioPlayback').src };
        journals.unshift(entry); saveAndRender();
        document.getElementById('journalArea').value = ""; document.getElementById('imgPreview').classList.add('hidden'); document.getElementById('audioPlayback').classList.add('hidden');
    }
    function deleteJournal(id) { if(confirm("確定要刪除這篇日記嗎？")) { journals = journals.filter(j => j.id !== id); saveAndRender(); } }
    function saveAndRender() { localStorage.setItem('mia_journals', JSON.stringify(journals)); renderJournals(); }
    function renderJournals() {
        document.getElementById('journalList').innerHTML = journals.map(j => `
            <div class="glass">
                <div class="flex justify-between items-start mb-2"><span class="text-[10px] text-[#C4B5A5]">${j.date}</span><button onclick="deleteJournal(${j.id})" class="text-red-300"><i class="fa-solid fa-trash"></i></button></div>
                <div class="text-sm mb-2">${j.text}</div>
                ${j.img.startsWith('data:') ? `<img src="${j.img}" class="w-full h-24 object-cover rounded mb-2">` : ''}
                ${j.audio.startsWith('blob:') ? `<audio src="${j.audio}" controls class="w-full"></audio>` : ''}
            </div>`).join('');
    }
    async function toggleRecord() {
        const btn = document.getElementById('micBtn');
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/wav' });
                document.getElementById('audioPlayback').src = URL.createObjectURL(blob);
                document.getElementById('audioPlayback').classList.remove('hidden');
                audioChunks = [];
            };
            mediaRecorder.start(); btn.innerText = "停止錄音";
        } else { mediaRecorder.stop(); btn.innerText = "錄音"; }
    }
    function previewImg(e) { const reader = new FileReader(); reader.onload = (e) => { document.getElementById('imgPreview').src = e.target.result; document.getElementById('imgPreview').classList.remove('hidden'); }; reader.readAsDataURL(e.target.files[0]); }
    function go(i) { document.querySelectorAll('.page').forEach((p, idx) => p.classList.toggle('active', i === idx)); }
    function updateAffirmation() { document.getElementById('dailyAffirmation').innerText = data.aff[Math.floor(Math.random() * data.aff.length)]; }

    // 初始化內容
    document.getElementById('tagContainer').innerHTML = Object.keys(data.guide).map(k => 
        `<button class="px-3 py-1 border rounded-full text-[10px] text-[#8E7E6E] bg-white" onclick="document.getElementById('guideContainer').innerHTML='${data.guide[k].map(q => '• ' + q).join('<br>')}'">${k}</button>`
    ).join('');
    document.getElementById('resetList').innerHTML = data.reset.map(s => `<p><strong>${s.t}</strong><br><span class="text-[10px] text-gray-400">${s.n}</span></p>`).join('');
    document.getElementById('numGrid').innerHTML = Object.keys(data.rit).map(n => `<div class="num-btn" onclick="document.getElementById('ritualDisplayArea').innerText='${data.rit[n]}'">0${n}</div>`).join('');
    document.getElementById('pathContainer').innerHTML = data.path.map(s => `<div class="glass"><h4 class="sub-header">${s.t}</h4><p class="text-[10px] text-gray-400 mb-2 italic">${s.d}</p>${s.items.map(it => `<div class="task-row" onclick="this.classList.toggle('done')"><strong>${it.n}</strong>: <span class="text-gray-500">${it.s}</span></div>`).join('')}</div>`).join('');
    renderJournals();
    updateAffirmation();
</script>
</body>
</html>
