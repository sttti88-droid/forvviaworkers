<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth OS | Final Integrated</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #F4F2EE; color: #5D544C; }
        .page { display: none; }
        .active { display: block; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.6); }
        .chk { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #D4C4B7; appearance: none; cursor: pointer; }
        .chk:checked { background: #8E7E6E; border-color: #8E7E6E; }
    </style>
</head>
<body class="pb-32 pt-6 px-4">

<div class="max-w-lg mx-auto">
    <!-- P1: 顯化儀式 -->
    <div id="p1" class="page active">
        <h1 class="text-2xl font-bold italic mb-6">Ritual / 儀式</h1>
        <div class="glass p-8 rounded-[32px] text-center mb-6">
            <p id="qText" class="text-lg italic font-medium">「成為你渴望見到的改變。」</p>
        </div>
        <div class="glass p-8 rounded-[32px] space-y-3 text-[15px]">
            <h2 class="font-bold border-b pb-2 mb-2">晨間核心 / Daily Ritual</h2>
            <p>1-2. <b>設定基調：</b> 今天會是美好的一天。</p>
            <p>3-4. <b>建立韌性：</b> 無論發生什麼都能應對。</p>
            <p>5-6. <b>自我接納：</b> 我被允許成為進步中的人。</p>
            <p>7-8. <b>長期價值：</b> 我對世界有重要貢獻。</p>
        </div>
    </div>

    <!-- P2: 30天成長路徑 -->
    <div id="p2" class="page">
        <h1 class="text-2xl font-bold italic mb-6">30-Day Path / 成長路徑</h1>
        <div id="taskContainer" class="space-y-4"></div>
    </div>

    <!-- P3: 影像手帳 -->
    <div id="p3" class="page">
        <h1 class="text-2xl font-bold italic mb-6">Journal / 覺察手帳</h1>
        <div class="glass p-6 rounded-[32px] mb-6">
            <textarea id="dInput" class="w-full h-24 bg-transparent outline-none text-[16px] mb-4" placeholder="記錄今日光芒..."></textarea>
            <div class="flex justify-between items-center">
                <input type="file" id="imgIn" accept="image/*" class="hidden">
                <button onclick="document.getElementById('imgIn').click()" class="text-sm text-[#A69C92]">📷 加圖片</button>
                <button onclick="saveD()" class="bg-[#8E7E6E] text-white px-8 py-2 rounded-full font-bold">儲存</button>
            </div>
        </div>
        <div id="dList" class="space-y-6"></div>
    </div>
</div>

<!-- 導航列 -->
<nav class="fixed bottom-6 left-0 right-0 flex justify-center gap-4 px-4">
    <div class="bg-white/90 backdrop-blur-xl rounded-[30px] shadow-2xl p-2 flex gap-2">
        <button onclick="nav(0)" class="px-6 py-3 rounded-2xl font-bold text-[#8E7E6E]">Ritual</button>
        <button onclick="nav(1)" class="px-6 py-3 rounded-2xl font-bold text-[#8E7E6E]">Challenge</button>
        <button onclick="nav(2)" class="px-6 py-3 rounded-2xl font-bold text-[#8E7E6E]">Journal</button>
    </div>
</nav>

<script>
    const data = [
        {d:1,t:"視覺碎形化",i:"換條路回家，拍下3個美學細節。"},{d:2,t:"數位減壓",i:"斷網1小時，聽大腦聲音。"},{d:3,t:"窒息點紀錄",i:"分析焦慮的發炎源。"},{d:4,t:"原形冒險",i:"嘗試未吃過的原形食物。"},{d:5,t:"童心拾遺",i:"找回兒時愛好。"},{d:6,t:"抽離練習",i:"用第三人稱觀察情緒。"},{d:7,t:"視覺排版",i:"整理桌面，丟掉沉重雜物。"},{d:8,t:"糖分斷捨離",i:"挑戰整天無糖。"},{d:9,t:"血糖與情緒",i:"記錄飯後心情。"},{d:10,t:"藍光斷電",i:"睡前兩小時不滑手機。"},{d:11,t:"動態冥想",i:"把通勤變成身體旅行。"},{d:12,t:"精準補水",i:"觀察皮膚亮度與精神。"},{d:13,t:"優雅說不",i:"練習拒絕邀約。"},{d:14,t:"抗炎美學",i:"親手做低GI餐。"},{d:15,t:"亮點掃描",i:"回想去年發光時刻。"},{d:16,t:"無限制假設",i:"金錢若不是問題做什麼？"},{d:17,t:"靈數對話",i:"研究你的5號人特質。"},{d:18,t:"他人之鏡",i:"詢問好友你的閃光點。"},{d:19,t:"提案思維",i:"將雜事優化為設計案。"},{d:20,t:"靈感寶庫",i:"收集10張意象圖。"},{d:21,t:"三年劇本",i:"寫下三年後的早晨。"},{d:22,t:"撕掉標籤",i:"在心裡刪除標籤。"},{d:23,t:"勇敢發聲",i:"分享你的真實觀點。"},{d:24,t:"職能重構",i:"結合美感與健康事業。"},{d:25,t:"浪漫儀式",i:"為日常瑣事設計儀式。"},{d:26,t:"財務自由拆解",i:"規劃副業目標。"},{d:27,t:"跨界連結",i:"傳訊給欣賞的創作者。"},{d:28,t:"碎片化冒險",i:"去新區域工作。"},{d:29,t:"實驗結案",i:"檢視身體發炎感。"},{d:30,t:"重新定義",i:"正式宣告新身分。"}
    ];
    
    function nav(i) {
        document.querySelectorAll('.page').forEach((p,idx) => p.classList.toggle('active', i===idx));
    }
    
    function render() {
        document.getElementById('taskContainer').innerHTML = data.map(x => `
            <div class="glass p-5 rounded-[24px]">
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="chk" ${localStorage.getItem('d'+x.d)?'checked':''}>
                    <div><span class="font-bold text-sm">Day ${x.d}｜${x.t}</span><p class="text-[13px] opacity-70">${x.i}</p></div>
                </div>
            </div>`).join('');
        renderD();
    }
    
    let imgData = null;
    document.getElementById('imgIn').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => imgData = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    };

    function saveD() {
        const v = document.getElementById('dInput').value;
        const h = JSON.parse(localStorage.getItem('logs')||'[]');
        h.unshift({id:Date.now(), v, img:imgData, d:new Date().toLocaleDateString()});
        localStorage.setItem('logs', JSON.stringify(h));
        document.getElementById('dInput').value = ''; imgData = null;
        renderD();
    }

    function renderD() {
        document.getElementById('dList').innerHTML = JSON.parse(localStorage.getItem('logs')||'[]').map(x => `
            <div class="glass p-5 rounded-[28px] relative">
                <button onclick="del(${x.id})" class="absolute top-4 right-4 text-xs text-red-400">刪除</button>
                <div class="text-[10px] text-[#A69C92] uppercase mb-2">${x.d}</div>
                ${x.img ? `<img src="${x.img}" class="w-full rounded-2xl mb-4 h-48 object-cover">` : ''}
                <p class="text-[15px]">${x.v}</p>
            </div>`).join('');
    }

    function del(id) {
        let h = JSON.parse(localStorage.getItem('logs')||'[]');
        h = h.filter(x => x.id !== id);
        localStorage.setItem('logs', JSON.stringify(h));
        renderD();
    }
    
    render();
</script>
</body>
</html>
